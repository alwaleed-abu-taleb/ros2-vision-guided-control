; PlatformIO configuration for the vision-guided pan/tilt controller.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; The ESP32Servo dependency is resolved by PlatformIO automatically; no global
; Arduino library install is required.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

; ESP32Servo provides the Servo class used for the pan/tilt PWM output.
lib_deps =
    madhephaestus/ESP32Servo@^3.0.0

build_flags =
    ; Serial line for the "X,Y\n" protocol must stay at 115200 on both ends.
    -DSERIAL_BAUD=115200
