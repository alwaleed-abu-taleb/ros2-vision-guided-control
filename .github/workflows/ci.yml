name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "opencv-python-headless>=4.5" "numpy>=1.21" "pyserial>=3.5" "pytest>=6.0"

      - name: Run unit tests
        run: python -m pytest ros2_ws/src/vision_guided_control/test -v

      - name: Syntax-check standalone tools
        run: python -m py_compile tools/serial_test.py tools/mock_esp32.py tools/calibrate_hsv.py
